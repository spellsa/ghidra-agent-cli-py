[package]
name = "ghidra-agent-cli-py"
version = "0.4.3"
edition = "2021"
authors = ["Alexander Kiselev"]
description = "Python inline CLI for resident Ghidra and parallel agents"
license = "GPL-3.0"
repository = "https://github.com/spellsa/ghidra-agent-cli-py"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.8"

[[bin]]
name = "ghidra"
path = "src/inline_main.rs"
